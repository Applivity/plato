# Plato academy definition (D31/D32/D33). Lives at .plato/academy.yaml —
# create it with Settings → Orchestration → Create example, or copy this.
# Activate in Settings → Orchestration → Academy; switch back to Solo/Duo
# any time. Philosophers NEVER approve tool calls.
academy:
  name: hcad-audit

members:
  # The worker does the work. Its model overrides the chat dropdown for the run.
  - name: plato
    model: anthropic:claude-sonnet-4-5
    role: "You fix bugs in Android Java code. Enumerate defects, fix them, re-verify."
    kind: worker
    # Keep PLATO.md + AGENTS.md/CLAUDE.md in this worker's prompt (default
    # true — inherits plato.worker.includeProjectRules). Set false to opt a
    # member out of the project files; the role above is never gated.
    includeProjectRules: true

  # Philosophers watch the run and steer it.
  - name: aristotle
    kind: philosopher
    model: litellm:openrouter-nvidia/nemotron-3-ultra-550b-a55b:free
    role: "You are a skeptical senior reviewer. Judge only from evidence."
    guidance: true
    pause: false
    cancel: true
    maxInterventions: 3
